[package]
name = "igelkottfisheye"
version = "0.23.0"
authors = ["Igelkott Film AB"]
edition = "2024"
description = "IgelkottFisheye for Adobe After Effects: Igelkott fisheye plates straight onto a wall, through the lens model"
license-file = "../LICENSE"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
after-effects = "0.4.0"

[build-dependencies]
pipl = "0.1.1"
cc = "1"

[profile.release]
opt-level = 3
lto = true
